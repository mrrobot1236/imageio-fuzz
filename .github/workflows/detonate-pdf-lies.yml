name: detonate-pdf-lies
on:
  workflow_dispatch:
  push:
    paths: ['detonation/pdfmatrix/**', '.github/workflows/detonate-pdf-lies.yml']
jobs:
  r:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: sw_vers
      - name: Build ASan harnesses
        working-directory: detonation/cve-2026-86950
        run: |
          F="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          clang $F -o /tmp/render render.c -framework ImageIO -framework CoreGraphics -framework CoreFoundation
          clang $F -o /tmp/draw ../pdfmatrix/draw.c -framework CoreGraphics -framework CoreFoundation
          [ -x /tmp/draw ] || { echo "draw build failed"; exit 1; }
      - name: Units
        run: |
          mkdir -p out
          python3 detonation/pdfmatrix/gen_pdf_lies.py pm
          rc=0; /tmp/render pm/ok.pdf > out/gate.log 2>&1 || rc=$?
          echo "gate exit=$rc"; cat out/gate.log
          [ $rc -eq 0 ] || { echo "GATE FAILED"; exit 1; }
          crashes=0; clean=0
          for f in pm/*.pdf; do
            n=$(basename "$f" .pdf); [ "$n" = ok ] && continue
            rc=0; /tmp/render "$f" > "out/$n.log" 2>&1 || rc=$?
            if grep -qE "AddressSanitizer|SEGV|deadly signal|runtime error" "out/$n.log"; then
              crashes=$((crashes+1)); echo "CRASH $n <<<<<"; grep -m3 -E "ERROR|SUMMARY|#[0-9]" "out/$n.log" | head -5
            else
              clean=$((clean+1)); echo "clean $n exit=$rc"
            fi
          done
          for f in pm/*.pdf; do
            n=$(basename "$f" .pdf)
            rc=0; /tmp/draw "$f" > "out/draw_$n.log" 2>&1 || rc=$?
            if grep -qE "AddressSanitizer|SEGV|deadly signal|runtime error" "out/draw_$n.log"; then
              crashes=$((crashes+1)); echo "CRASH draw_$n <<<<<"; grep -m3 -E "ERROR|SUMMARY" "out/draw_$n.log"
            else clean=$((clean+1)); fi
          done
          echo "--- verbose probe"
          for n in wmax whmax big8k_short imagemask_wmax smask_4k_empty pattern_huge; do
            echo "## $n"; CG_PDF_VERBOSE=1 /tmp/render "pm/$n.pdf" 2>&1 | head -12
          done
          echo "=== PDF-LIES: $clean clean / $crashes crash"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pdf-lies, path: out/, retention-days: 30}
