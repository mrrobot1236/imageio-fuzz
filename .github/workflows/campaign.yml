name: imageio-campaign
on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'Campaign duration in seconds'
        default: '7200'
jobs:
  fuzz:
    runs-on: macos-14
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with libFuzzer runtime
        run: |
          ls /Applications | grep -i xcode || true
          picked=""
          for x in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            [ -e "$x" ] || continue
            rd=$(DEVELOPER_DIR="$x" xcrun clang -print-resource-dir 2>/dev/null) || continue
            if [ -f "$rd/lib/darwin/libclang_rt.fuzzer_osx.a" ]; then picked="$x"; echo "runtime at $rd/lib/darwin/"; break; fi
          done
          if [ -z "$picked" ]; then echo "No Xcode with fuzzer runtime found"; exit 1; fi
          echo "Picked $picked"
          sudo xcode-select -s "$picked"
          clang --version | head -1
      - name: Build harness
        run: |
          clang -fsanitize=fuzzer,address,undefined -g -O1 \
            -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
            harness/imageio_fuzz.m -o imageio_fuzz
          file imageio_fuzz
      - name: Run campaign
        run: |
          mkdir -p findings
          ./imageio_fuzz corpus -max_total_time=${{ inputs.max_seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1 \
            -artifact_prefix=findings/ 2>&1 | tee fuzz.log
      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings
          path: |
            findings/
            fuzz.log
          retention-days: 30
