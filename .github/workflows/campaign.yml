name: imageio-campaign
on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'Campaign duration in seconds'
        default: '7200'
jobs:
  fuzz:
    runs-on: macos-14
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain diagnostics
        run: |
          rd=$(clang -print-resource-dir); echo "DEFAULT rd: $rd"
          ls "$rd/lib/darwin/" 2>/dev/null | head -60
          echo "=== per-xcode ==="
          for x in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            [ -e "$x" ] || continue
            rd2=$(DEVELOPER_DIR="$x" xcrun clang -print-resource-dir 2>/dev/null)
            echo "$x -> $rd2"
            ls "$rd2/lib/darwin/" 2>/dev/null | grep -i fuzzer | head -4
          done
          echo "=== brew llvm ==="
          ls /opt/homebrew/opt/llvm/lib/clang/*/lib/darwin/ 2>/dev/null | grep -i fuzzer | head -6
          find /opt/homebrew -name 'libclang_rt.fuzzer*' 2>/dev/null | head -5
          echo "=== xcode-select ==="
          xcode-select -p
          clang --version | head -2
      - name: Build harness
        run: |
          clang -fsanitize=fuzzer,address,undefined -g -O1 \
            -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
            harness/imageio_fuzz.m -o imageio_fuzz
          file imageio_fuzz
      - name: Run campaign
        run: |
          mkdir -p findings
          ./imageio_fuzz corpus -max_total_time=${{ inputs.max_seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1 \
            -artifact_prefix=findings/ 2>&1 | tee fuzz.log
      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings
          path: |
            findings/
            fuzz.log
          retention-days: 30
