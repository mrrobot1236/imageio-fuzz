name: imageio-campaign
on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'Campaign duration in seconds'
        default: '7200'
jobs:
  fuzz:
    runs-on: macos-14
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Build harness
        run: |
          CLANG=$(ls /opt/homebrew/opt/llvm@15/bin/clang /opt/homebrew/opt/llvm/bin/clang /opt/homebrew/bin/clang 2>/dev/null | head -1)
          echo "clang: $CLANG"
          $CLANG --version | head -2
          $CLANG -fsanitize=fuzzer,address,undefined -g -O1 \
            -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
            harness/imageio_fuzz.m -o imageio_fuzz
          file imageio_fuzz
      - name: Run campaign
        run: |
          mkdir -p findings
          ./imageio_fuzz corpus -fork=1 -ignore_timeouts=1 -ignore_ooms=1 -ignore_crashes=1 \
            -max_total_time=${{ inputs.max_seconds }} \
            -rss_limit_mb=4096 -timeout=25 -print_final_stats=1 \
            -artifact_prefix=findings/ 2>&1 | tee fuzz.log
      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings
          path: |
            findings/
            fuzz.log
          retention-days: 30
