name: pdfgraph
on:
  workflow_dispatch:
  push:
    paths: ['detonation/pdfgraph/**', '.github/workflows/pdfgraph.yml']
jobs:
  graph:
    strategy:
      fail-fast: false
      matrix: { lane: [1,2,3] }
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: sw_vers
      - name: Build
        working-directory: detonation/pdfgraph
        run: |
          F="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          clang $F -o /tmp/hash hashdraw.c -framework CoreGraphics -framework CoreFoundation || exit 1
      - name: Gate + structural set
        run: |
          mkdir -p out
          python3 detonation/pdfgraph/gen_graph.py pm
          /tmp/hash pm/ok.pdf > out/gate.log 2>&1 || { echo GATE_FAIL; cat out/gate.log; exit 1; }
          grep -q PAINTED out/gate.log || { echo GATE_BLANK; exit 1; }
          echo "gate OK: $(cat out/gate.log)"
          python3 detonation/pdfgraph/classify.py pm out ok.pdf
      - name: Oracle-greedy rounds
        run: |
          SEED=$((1000 + ${{ matrix.lane }}))
          python3 detonation/pdfgraph/mutate.py pm out/m${{ matrix.lane }} 8 120 /tmp/hash 2700 || echo "mutator exit=$?"
          ls out/m${{ matrix.lane }} | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "pdfgraph-${{ matrix.lane }}", path: out/, retention-days: 30}
