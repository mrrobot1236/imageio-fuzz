name: pdfgraph
on:
  workflow_dispatch:
  push:
    paths: ['detonation/pdfgraph/**', '.github/workflows/pdfgraph.yml']
jobs:
  graph:
    strategy:
      fail-fast: false
      matrix: { lane: [1,2,3] }
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: sw_vers
      - name: Build
        working-directory: detonation/pdfgraph
        run: |
          F="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          clang $F -o /tmp/hash hashdraw.c -framework CoreGraphics -framework CoreFoundation || exit 1
      - name: Gate + structural set
        run: |
          mkdir -p out
          python3 detonation/pdfgraph/gen_graph.py pm
          /tmp/hash pm/ok.pdf > out/gate.log 2>&1 || { echo GATE_FAIL; cat out/gate.log; exit 1; }
          grep -q PAINTED out/gate.log || { echo GATE_BLANK; exit 1; }
          echo "gate OK: $(cat out/gate.log)"
          python3 - <<'PY'
import glob, subprocess, os, shutil
crash=0; blank=0; painted=0; fail=0
for f in sorted(glob.glob('pm/*.pdf')):
    if f.endswith('/ok.pdf'): continue
    try: p = subprocess.run(['/tmp/hash', f], capture_output=True, text=True, timeout=60)
    except subprocess.TimeoutExpired:
        print('TIMEOUT', os.path.basename(f)); shutil.copyfile(f,'out/TIMEOUT_'+os.path.basename(f)); continue
    e = p.stderr or ''
    if 'AddressSanitizer' in e or 'SEGV' in e or 'deadly signal' in e or 'runtime error' in e:
        crash+=1; print('CRASH', os.path.basename(f)); print(e[:500]); shutil.copyfile(f,'out/CRASH_'+os.path.basename(f))
    elif p.returncode != 0 or not (p.stdout or '').strip():
        fail+=1; print('fail', os.path.basename(f), (e.strip().splitlines() or [''])[-1][:80])
    elif (p.stdout or '').startswith('BLANK'):
        blank+=1; print('blank', os.path.basename(f), p.stdout.strip())
    else:
        painted+=1; print('painted', os.path.basename(f), p.stdout.strip())
print(f'=== GRAPH: {painted} painted / {blank} blank / {fail} fail / {crash} crash')
PY
      - name: Oracle-greedy rounds
        run: |
          SEED=$((1000 + ${{ matrix.lane }}))
          timeout 3000 python3 detonation/pdfgraph/mutate.py pm out/m${{ matrix.lane }} 8 120 /tmp/hash || echo "mutator exit=$?"
          ls out/m${{ matrix.lane }} | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "pdfgraph-${{ matrix.lane }}", path: out/, retention-days: 30}
