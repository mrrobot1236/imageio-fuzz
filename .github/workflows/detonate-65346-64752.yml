name: detonate-65346-64752
on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'Fuzz seconds per CVE lane'
        default: '5400'
      asan_max_seconds:
        description: 'ASan seed-battery seconds'
        default: '600'
  push:
    paths: ['detonation/cve-2026-65346/**', 'detonation/cve-2026-64752/**', 'harness/**']

jobs:
  detonate:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        cve: ['65346', '64752']
    timeout-minutes: 200
    env:
      CVE: ${{ matrix.cve }}
    steps:
      - uses: actions/checkout@v4

      - name: Fingerprint OS + frameworks
        run: |
          sw_vers || true
          for fw in ImageIO CoreMedia CoreGraphics; do
            f="/System/Library/Frameworks/${fw}.framework/${fw}"
            otool -L "$f" 2>/dev/null | head -2 || echo "$fw: not found"
          done

      - name: Resolve clang (libFuzzer smoke-test chain)
        run: |
          printf '%s\n'             '#import <Foundation/Foundation.h>' \
            '#import <ImageIO/ImageIO.h>' \
            'int LLVMFuzzerTestOneInput(const uint8_t *d, size_t s) { return 0; }' > /tmp/smoke.m
          tryclang() {
            "$1" -fsanitize=fuzzer,address,undefined -g -O1 -x objective-c /tmp/smoke.m \
              -framework Foundation -framework ImageIO -o /tmp/smoke.bin >/dev/null 2>&1
          }
          CLANG=""
          for c in /opt/homebrew/opt/llvm@15/bin/clang /opt/homebrew/opt/llvm/bin/clang /usr/bin/clang; do
            if [ -x "$c" ] && tryclang "$c"; then CLANG="$c"; break; fi
          done
          if [ -z "$CLANG" ] && command -v brew >/dev/null 2>&1; then
            for f in llvm@18 llvm@19 llvm@20 llvm@21 llvm@22 llvm; do
              echo "no preinstalled clang passed smoke test, trying brew install $f..."
              brew install "$f" >/dev/null 2>&1 || continue
              c="/opt/homebrew/opt/$f/bin/clang"
              if [ -x "$c" ] && tryclang "$c"; then CLANG="$c"; break; fi
            done
          fi
          if [ -z "$CLANG" ]; then
            CLANG=/usr/bin/clang
            echo "WARNING: no clang passed libFuzzer smoke test, falling back to Apple clang"
          fi
          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "using clang: $CLANG"
          $CLANG --version | head -1 || true

      - name: Resolve SDKs (prefer one with CMPhoto.h)
        run: |
          CANDIDATES=""
          for d in /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX*.sdk; do
            [ -d "$d" ] && CANDIDATES="$CANDIDATES $d"
          done
          XCSDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)
          [ -n "$XCSDK" ] && CANDIDATES="$CANDIDATES $XCSDK"
          CANDIDATES="$CANDIDATES /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
          echo "SDK candidates: $CANDIDATES"
          CM_SDK=""
          SDK=""
          for s in $CANDIDATES; do
            if [ -f "$s/System/Library/Frameworks/CoreMedia.framework/Headers/CMPhoto.h" ] \
               || [ -f "$s/System/Library/Frameworks/CoreMedia.framework/PrivateHeaders/CMPhoto.h" ]; then
              CM_SDK="$s"; break
            fi
          done
          for s in $CANDIDATES; do
            if [ -d "$s" ]; then SDK="$s"; break; fi
          done
          echo "CM_SDK=$CM_SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK"
          echo "CMPhoto.h SDK: ${CM_SDK:-NONE}"

      - name: Build 65346 harness (native + ASan+UBSan)
        if: matrix.cve == '65346'
        working-directory: detonation/cve-2026-65346
        run: |
          echo "clang: $CLANG"
          cp ../../harness/imageio_fuzz.m .
          $CLANG -fsanitize=fuzzer,address,undefined -g -O1 \
            -isysroot "$SDK" \
            -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
            imageio_fuzz.m -o imageio_fuzz_65346

      - name: Build 64752 harness (ImageIO->CMPhoto funnel, public API only)
        if: matrix.cve == '64752'
        working-directory: detonation/cve-2026-64752
        run: |
          echo "clang: $CLANG  SDK: $SDK"
          cp ../../harness/imageio_fuzz.m .
          if $CLANG -fsanitize=fuzzer,address,undefined -g -O1 \
              -isysroot "$SDK" \
              -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
              -framework CoreMedia -framework CoreVideo \
              coremedia_fuzz.m -o imageio_fuzz_64752 2>cm_build.log; then
            echo "64752: CMPhoto-funnel harness built"
          else
            echo "64752: funnel build failed, falling back to plain ImageIO"
            [ -f cm_build.log ] && tail -20 cm_build.log || true
            $CLANG -fsanitize=fuzzer,address,undefined -g -O1 \
              -isysroot "$SDK" \
              -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
              imageio_fuzz.m -o imageio_fuzz_64752
          fi

      - name: Build real-corpus generator + generate real images
        working-directory: detonation/cve-2026-${{ matrix.cve }}
        run: |
          mkdir -p real corpus
          python3 ../../harness/gen_real_corpus.py real/
          cp -a real/. corpus/
          cp -a seeds_${CVE}/. corpus/ 2>/dev/null || true
          echo "corpus size: $(ls corpus | wc -l) files, $(du -sh corpus | cut -f1)"

      - name: ASan seed battery (real + boundary corpus, one pass)
        working-directory: detonation/cve-2026-${{ matrix.cve }}
        run: |
          mkdir -p out/battery
          ./imageio_fuzz_${CVE} corpus -runs=1 \
            -max_total_time=${{ inputs.asan_max_seconds || '600' }} \
            -max_len=8388608 \
            -print_final_stats=1 \
            -artifact_prefix=out/battery/ 2>&1 | tee out/battery/asan_battery.log

      - name: libFuzzer campaign (max volume, fork=3)
        working-directory: detonation/cve-2026-${{ matrix.cve }}
        run: |
          mkdir -p out/campaign
          ./imageio_fuzz_${CVE} corpus -fork=3 \
            -max_total_time=${{ inputs.max_seconds || '5400' }} \
            -max_len=8388608 -len_control=0 \
            -rss_limit_mb=4096 -timeout=25 \
            -dict=${CVE}.dict \
            -print_final_stats=1 \
            -artifact_prefix=out/campaign/ 2>&1 | tee out/campaign/fuzz.log || true

      - name: Collect crash reports
        if: always()
        working-directory: detonation/cve-2026-${{ matrix.cve }}
        run: |
          mkdir -p out/ips
          find ~/Library/Logs/DiagnosticReports -type f \( -name "*.ips" -o -name "*imageio*" -o -name "*fuzzer*" \) \
            -exec cp {} out/ips/ \; 2>/dev/null || true
          ls -la out/ out/campaign/ out/ips/ || true

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: det-${{ matrix.cve }}-${{ matrix.os }}
          path: |
            detonation/cve-2026-${{ matrix.cve }}/out/
            detonation/cve-2026-${{ matrix.cve }}/corpus/
          retention-days: 30
