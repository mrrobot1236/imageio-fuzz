name: detonate-65346-64752
on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: 'Fuzz seconds per CVE lane'
        default: '3600'
      asan_max_seconds:
        description: 'ASan seed-battery seconds'
        default: '600'
  push:
    paths: ['detonation/cve-2026-65346/**', 'detonation/cve-2026-64752/**']

jobs:
  detonate:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26-arm64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fingerprint OS + frameworks
        run: |
          sw_vers || true
          for fw in ImageIO CoreMedia CoreGraphics; do
            f="/System/Library/Frameworks/${fw}.framework/${fw}"
            otool -L "$f" 2>/dev/null | head -2 || echo "$fw: not found"
          done
          # Resolve a clang that ships the libFuzzer runtime AND links cleanly
          # (Apple clang lacks libclang_rt.fuzzer_osx.a; newest homebrew llvm
          #  can hit 'ld: invalid r_symbolnum' on older images -> smoke-test all)
          printf '%s\n' \
            '#import <Foundation/Foundation.h>' \
            '#import <ImageIO/ImageIO.h>' \
            'int LLVMFuzzerTestOneInput(const uint8_t *d, size_t s) { return 0; }' > /tmp/smoke.m
          tryclang() {
            "$1" -fsanitize=fuzzer,address,undefined -g -O1 -x objective-c /tmp/smoke.m \
              -framework Foundation -framework ImageIO -o /tmp/smoke.bin >/dev/null 2>&1
          }
          CLANG=""
          for c in /opt/homebrew/opt/llvm@15/bin/clang /opt/homebrew/opt/llvm/bin/clang /usr/bin/clang; do
            if [ -x "$c" ] && tryclang "$c"; then CLANG="$c"; break; fi
          done
          if [ -z "$CLANG" ] && command -v brew >/dev/null 2>&1; then
            for f in llvm@18 llvm@19 llvm@20 llvm@21 llvm@22 llvm; do
              echo "no preinstalled clang passed smoke test, trying brew install $f..."
              brew install "$f" >/dev/null 2>&1 || continue
              c="/opt/homebrew/opt/$f/bin/clang"
              if [ -x "$c" ] && tryclang "$c"; then CLANG="$c"; break; fi
            done
          fi
          if [ -z "$CLANG" ]; then
            CLANG=/usr/bin/clang
            echo "WARNING: no clang passed libFuzzer smoke test, falling back to Apple clang"
          fi
          echo "using clang: $CLANG"
          $CLANG --version | head -1 || true
        run: |
          mkdir -p ../65346_findings ips
          ./imageio_fuzz_65346 seeds_65346 -runs=1 \
            -max_total_time=${{ inputs.asan_max_seconds || '600' }} \
            -artifact_prefix=../65346_findings/ 2>&1 | tee ../65346_findings/asan_battery.log

      - name: ASan seed battery (64752)
        working-directory: detonation/cve-2026-64752
        run: |
          mkdir -p ../64752_findings
          ./imageio_fuzz_64752 seeds_64752 -runs=1 \
            -max_total_time=${{ inputs.asan_max_seconds || '600' }} \
            -artifact_prefix=../64752_findings/ 2>&1 | tee ../64752_findings/asan_battery.log

      - name: libFuzzer campaigns (int-overflow hunt)
        run: |
          mkdir -p campaign65346 campaign64752
          cd detonation/cve-2026-65346
          ./imageio_fuzz_65346 seeds_65346 -fork=1 \
            -max_total_time=${{ inputs.max_seconds || '3600' }} \
            -rss_limit_mb=4096 -timeout=25 \
            -artifact_prefix=../../campaign65346/ 2>&1 | tee ../../campaign65346/fuzz.log || true
          cd ../cve-2026-64752
          ./imageio_fuzz_64752 seeds_64752 -fork=1 \
            -max_total_time=${{ inputs.max_seconds || '3600' }} \
            -rss_limit_mb=4096 -timeout=25 \
            -artifact_prefix=../../campaign64752/ 2>&1 | tee ../../campaign64752/fuzz.log || true

      - name: Collect crash reports
        if: always()
        run: |
          date > /tmp/det_start
          mkdir -p findings65346/ips findings64752/ips
          find ~/Library/Logs/DiagnosticReports -type f \( -name "*.ips" -o -name "*imageio*" -o -name "*fuzzer*" \) \
            -newer /tmp/det_start -exec cp {} findings65346/ips/ \; 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -type f \( -name "*.ips" -o -name "*imageio*" -o -name "*fuzzer*" \) \
            -exec cp {} findings64752/ips/ \; 2>/dev/null || true

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detonation-65346-64752-${{ matrix.os }}
          path: |
            detonation/cve-2026-65346/seeds_65346/
            detonation/cve-2026-64752/seeds_64752/
            65346_findings/
            64752_findings/
            campaign65346/
            campaign64752/
            findings65346/
            findings64752/
          retention-days: 30
