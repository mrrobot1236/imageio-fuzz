name: verify-response
on:
  workflow_dispatch:
  push:
    paths: ['detonation/response/**', '.github/workflows/verify-response.yml']

jobs:
  v:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build harnesses
        working-directory: detonation/cve-2026-86950
        run: |
          clang -O2 -o /tmp/render render.c -framework ImageIO -framework CoreGraphics -framework CoreFoundation
          mkdir -p /tmp/o
          cat > /tmp/d.m <<'M'
          #import <Foundation/Foundation.h>
          #import <ImageIO/ImageIO.h>
          int main(int c, char**v){ @autoreleasepool {
            CGImageSourceRef s = CGImageSourceCreateWithURL((__bridge CFURLRef)[NSURL fileURLWithPath:[NSString stringWithUTF8String:v[1]]], NULL);
            if(!s){ printf("IMG=nil\n"); return 0; }
            CGImageRef i = CGImageSourceCreateImageAtIndex(s, 0, NULL);
            if(!i){ printf("IMG=nil\n"); return 0; }
            printf("IMG=%zux%zu\n", CGImageGetWidth(i), CGImageGetHeight(i));
          } return 0; }
          M
          clang -O2 -o /tmp/d /tmp/d.m -framework Foundation -framework ImageIO -framework CoreGraphics
      - name: Image outcomes
        run: |
          for f in detonation/response/image/*.heic; do
            n=$(basename "$f" .heic)
            echo "-- $n"; /tmp/d "$f"
          done 2>&1 | tee /tmp/o/img.txt
      - name: PDF outcomes
        run: |
          for f in detonation/response/pdf/*.pdf; do
            n=$(basename "$f" .pdf); rc=0
            /tmp/render "$f" > /tmp/o/$n.log 2>&1 || rc=$?
            echo "$n exit=$rc :: $(tail -1 /tmp/o/$n.log)"
          done 2>&1 | tee /tmp/o/pdf.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verify-response, path: /tmp/o/, retention-days: 14}
