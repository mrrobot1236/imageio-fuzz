name: detonate-dimsweep
on:
  workflow_dispatch:
  push:
    paths: ['detonation/cve-2026-64752/dim-matrix/**', 'detonation/cve-2026-64752/gen_dim_matrix.py', '.github/workflows/detonate-dimsweep.yml']

jobs:
  dimsweep:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve clang (libFuzzer smoke-test chain)
        run: |
          printf '%s\n' \
            '#import <Foundation/Foundation.h>' \
            '#import <ImageIO/ImageIO.h>' \
            'int LLVMFuzzerTestOneInput(const uint8_t *d, size_t s) { return 0; }' > /tmp/smoke.m
          tryclang() {
            "$1" -fsanitize=fuzzer,address,undefined -g -O1 -x objective-c /tmp/smoke.m \
              -framework Foundation -framework ImageIO -o /tmp/smoke.bin >/dev/null 2>&1
          }
          CLANG=""
          for c in /opt/homebrew/opt/llvm@15/bin/clang /opt/homebrew/opt/llvm/bin/clang /usr/bin/clang; do
            if [ -x "$c" ] && tryclang "$c"; then CLANG="$c"; break; fi
          done
          if [ -z "$CLANG" ] && command -v brew >/dev/null 2>&1; then
            for f in llvm@18 llvm@19 llvm@20 llvm@21 llvm@22 llvm; do
              echo "no preinstalled clang passed smoke test, trying brew install $f..."
              brew install "$f" >/dev/null 2>&1 || continue
              c="/opt/homebrew/opt/$f/bin/clang"
              if [ -x "$c" ] && tryclang "$c"; then CLANG="$c"; break; fi
            done
          fi
          if [ -z "$CLANG" ]; then
            CLANG=/usr/bin/clang
            echo "WARNING: falling back to Apple clang"
          fi
          echo "CLANG=$CLANG" >> "$GITHUB_ENV"

      - name: Resolve SDK
        run: |
          SDK=""
          for d in /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX*.sdk; do
            [ -d "$d" ] && SDK="$d" && break
          done
          [ -z "$SDK" ] && SDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)
          [ -z "$SDK" ] && SDK=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK"

      - name: Build 64752 harness (ImageIO->CMPhoto funnel)
        working-directory: detonation/cve-2026-64752
        run: |
          cp ../../harness/imageio_fuzz.m .
          if $CLANG -fsanitize=fuzzer,address,undefined -g -O1 \
              -isysroot "$SDK" \
              -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
              -framework CoreMedia -framework CoreVideo \
              coremedia_fuzz.m -o imageio_fuzz_64752 2>cm_build.log; then
            echo "funnel harness built"
          else
            echo "funnel build failed, falling back to plain ImageIO"
            [ -f cm_build.log ] && tail -20 cm_build.log || true
            $CLANG -fsanitize=fuzzer,address,undefined -g -O1 \
              -isysroot "$SDK" \
              -framework CoreFoundation -framework CoreGraphics -framework ImageIO \
              imageio_fuzz.m -o imageio_fuzz_64752
          fi

      - name: Dim-boundary battery (runs=1 per unit, full stacks)
        working-directory: detonation/cve-2026-64752
        run: |
          mkdir -p out/dimsweep
          total=0; ooms=0; timeouts=0; crashes=0; clean=0
          for u in dim-matrix/*.heic; do
            [ -f "$u" ] || continue
            n=$(basename "$u" .heic)
            total=$((total+1))
            rc=0
            ./imageio_fuzz_64752 "$u" -runs=1 \
              -max_len=8388608 \
              -rss_limit_mb=4096 -malloc_limit_mb=4096 -timeout=25 \
              -artifact_prefix=out/dimsweep/ > out/dimsweep/$n.log 2>&1 || rc=$?
            if grep -q "out-of-memory" out/dimsweep/$n.log; then
              ooms=$((ooms+1)); echo "OOM  $n"
            elif grep -q "libFuzzer: timeout" out/dimsweep/$n.log; then
              timeouts=$((timeouts+1)); echo "T/O  $n"
            elif grep -qE "ERROR: libFuzzer: deadly signal|ERROR: AddressSanitizer" out/dimsweep/$n.log; then
              crashes=$((crashes+1)); echo "CRASH $n  <<<<<"
            else
              clean=$((clean+1))
            fi
          done
          echo "=== DIMSWEEP SUMMARY: $total units | $ooms OOM | $timeouts timeout | $crashes CRASH | $clean clean"

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dimsweep-${{ matrix.os }}
          path: detonation/cve-2026-64752/out/
          retention-days: 30
