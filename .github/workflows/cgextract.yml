name: cg-binary-extract
on:
  workflow_dispatch:
  push:
    paths: ['detonation/cg-extract/**']
jobs:
  extract:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract CoreGraphics + ImageIO
        run: |
          mkdir -p findings
          cd detonation/cg-extract
          bash extract.sh || true
          cd ../..
          cp -f detonation/cg-extract/*.txt detonation/cg-extract/*.asm findings/ 2>/dev/null || true
          ls -la findings/
      - uses: actions/upload-artifact@v4
        with:
          name: cg-re-macos14
          path: findings/
          retention-days: 30
