name: phase-M-N-campaign
on:
  workflow_dispatch:
  push:
    paths: ['detonation/cg-extract/**', 'detonation/ios-oracle/**', '.github/workflows/cgextract.yml']
jobs:
  gadget39:
    runs-on: macos-14
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: RIP-39 gadget stage
        run: |
          bash detonation/cg-extract/j67.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rip39-gadget
          path: findings/
          retention-days: 30
  oracle38:
    runs-on: macos-14
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: RIP-38 blind oracle
        run: |
          bash detonation/cg-extract/j68.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rip38-oracle
          path: findings/
          retention-days: 30
  aslr40:
    runs-on: macos-14
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: RIP-40 ASLR leak
        run: |
          bash detonation/cg-extract/j69.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rip40-aslr
          path: findings/
          retention-days: 30
  gadget26o2:
    runs-on: macos-26
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: RIP-39 gadget on 26 (O2)
        run: |
          bash detonation/cg-extract/j70.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rip39-gadget-26o2
          path: findings/
          retention-days: 30
  gadget41-26:
    runs-on: macos-26
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: RIP-41 offset-free gadget (macOS 26)
        run: |
          bash detonation/cg-extract/j71.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rip41-gadget-26
          path: findings/
          retention-days: 30
  gadget41-14:
    runs-on: macos-14
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: RIP-41 offset-free gadget (macOS 14 control)
        run: |
          bash detonation/cg-extract/j71.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rip41-gadget-14
          path: findings/
          retention-days: 30
  patched26:
    runs-on: macos-26
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Detonate on patched macOS 26
        run: |
          bash detonation/cg-extract/j67.sh || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n26-gadget
          path: findings/
          retention-days: 30

  ios-oracle-v1:
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: ORACLE v1 band calibration (thumbnail ingest scan)
        run: |
          bash detonation/ios-oracle/j72.sh || true
      - name: Upload oracle v1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-oracle-v1
          path: findings/ios-oracle/
