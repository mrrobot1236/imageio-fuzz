name: cg-binary-extract
on:
  workflow_dispatch:
  push:
    paths: ['detonation/cg-extract/**']
jobs:
  extract:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract CoreGraphics + ImageIO
        run: |
          mkdir -p findings
          cd detonation/cg-extract
          bash extract.sh || true
          cd ../..
          for f in detonation/cg-extract/xout/CoreGraphics detonation/cg-extract/xout/com.apple.CoreGraphics detonation/cg-extract/util.log; do
            [ -f "$f" ] && cp -f "$f" findings/ || true
          done
          ls -la findings/
      - uses: actions/upload-artifact@v4
        with:
          name: cg-binaries-macos14
          path: findings/
          retention-days: 30
