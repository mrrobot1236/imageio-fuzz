name: phase-M-N-campaign
on:
  workflow_dispatch:
  push:
    paths: ['detonation/cg-extract/**']
jobs:
  extract:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract CoreGraphics + ImageIO
        run: |
          bash detonation/cg-extract/j29.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: rip1b-recon
          path: findings/
          retention-days: 30
  patched26:
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Detonate on patched macOS 26
        run: |
          bash detonation/cg-extract/j29.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: n26-verdict
          path: findings26/
          retention-days: 30
