name: phase-J1-write-trace
on:
  workflow_dispatch:
  push:
    paths: ['detonation/cg-extract/**']
jobs:
  extract:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract CoreGraphics + ImageIO
        run: |
          bash detonation/cve-2026-86950/j1.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: cg-re-macos14
          path: findings/
          retention-days: 30
